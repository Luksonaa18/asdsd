<script>
const D=[{"n": 1, "q": "ქსელური ადაპტერის კავშირი ქსელის პროგრამულ უზრუნველყოფასთან ხორციელდება:", "a": ["ადაპტერების დრაივერების მეშვეობით"], "m": false}, {"n": 2, "q": "კომპიუტერული ქსელები ხასიათდებიან სიდიდის მიხედვით (ტერიტორიის, დაფარვის ზონა). აირჩიეთ შესაბამისი ქსელები:", "a": ["LAN", "MAN", "WAN"], "m": true}, {"n": 3, "q": "ლოკალური ქსელის (LAN) თავისებურებებია:", "a": ["მოწყობილობების დაკავშირება ლოკალურ არეში, როგორიცაა შენობა ან კამპუსი", "სერვისების ფოკუსირება წვდომის და განაწილების დონეზე", "Ethernet არქიტექტურასთან თავსებადობა"], "m": true}, {"n": 4, "q": "რომელმა ადრე არსებულმა ტექნოლოგიამ განაპირობა გლობალური კომპიუტერული ქსელების სწრაფი განვითარების პროგრესი:", "a": ["სატელეფონო ქსელები"], "m": false}, {"n": 5, "q": "STP CAT5 სტანდარტი ეკუთვნის კაბელს, რომელიც არის:", "a": ["ეკრანირებული გრეხილი წყვილი"], "m": false}, {"n": 6, "q": "ლოკალური ქსელის ყოველ მოწყობილობას უნდა გააჩნდეს თავისი უნიკალური მისამართი (MAC) იმისათვის, რომ მასთან შესაძლებელი იყოს პაკეტების დამისამართება. ვინ განსაზღვრავს და რა ეტაპზე ენიჭება იგი ქსელურ მოწყობილობებს:", "a": ["ამ მიდგომის იდეა მდგომარეობს იმაში, რომ ქსელის ყოველ მოწყობილობას ფირმა-მწარმოებელი ანიჭებს მას დამზადების ეტაპზე"], "m": false}, {"n": 7, "q": "ქსელში აბონენტებს შორის ურთიერთქმედების (პაკეტების კომუტაციის) მეთოდებია:", "a": ["ურთიერთქმედების მეთოდი დეიტაგრამების საშუალებით", "ურთიერთქმედების მეთოდი ლოგიკური კავშირით (ვირტუალური არხებით)"], "m": true}, {"n": 8, "q": "TCP/IP სტეკის საფოსტო პროტოკოლებია:", "a": ["IMAP", "SMTP", "POP3"], "m": true}, {"n": 9, "q": "საქსელო პაკეტის რომელ ნაწილში არის მითითებული კონკრეტული მოწყობილობის აპარატურული მისამართი (MAC):", "a": ["თავსართში (Header)"], "m": false}, {"n": 10, "q": "Ethernet ქსელისთვის შემუშავებულია სეგმენტების სტანდარტები. სეგმენტის დასახელება მოიცავს სამ ელემენტს:", "a": ["მოდულაციის არსებობა (BASE)", "კავშირის არხის ტიპი", "გადაცემის სიჩქარე"], "m": true}, {"n": 11, "q": "ქსელის სტრუქტურიზაციის ქვეშ იგულისხმება სხვადასხვა ცნებები, რომლებიც ეხება ქსე
